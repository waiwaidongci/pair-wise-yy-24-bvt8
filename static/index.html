<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>电台排程</title>
<style>
body{font:15px system-ui;max-width:1180px;margin:24px auto;padding:0 16px;background:#f7f7f5;color:#222}
section{background:white;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}
input,select,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}
button{cursor:pointer;background:#16324f;color:white}pre{white-space:pre-wrap;max-height:360px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input{width:90%}
.day{border:1px solid #d7d7d2;border-radius:8px;margin:8px 0;padding:8px 12px}
.day h3{margin:4px 0;font-size:15px;color:#16324f}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:4px 8px;text-align:left;font-size:13px}
.conflict{background:#fff3f3;border:1px solid #d44;color:#922;padding:10px;border-radius:8px;white-space:pre-wrap}
.note{color:#777;font-size:12px}
</style>
<h1>电台播出与版权窗口排程</h1>
<section><h2>当前计划（播出日 06:00 切日）</h2><button onclick="load()">刷新</button>
<div id="plan"></div><details><summary>原始状态</summary><pre id="state"></pre></details></section>
<section><h2>新建节目</h2><div class="grid">
<input id="title" placeholder="节目名"><select id="kind"><option>music</option><option>ad</option><option>talk</option><option>live</option></select>
<input id="duration" type="number" value="30" placeholder="分钟"><input id="start" value="2026-01-01"><input id="end" value="2026-12-31">
<input id="region" value="华东"><input id="sponsor" placeholder="赞助商，可空"><input id="cooldown" type="number" value="0" placeholder="冷却分钟">
</div><button onclick="addProgram()">创建并授权地区</button></section>
<section><h2>排期 / 移动 / 替换 / 实播对账</h2>
<div class="note">播出日按 06:00 切分：钟点早于 06:00 的凌晨档自动落到该播出日的次日日历日（例如播出日 09-28 的 02:00 = 日历 09-29 02:00）。</div>
<div class="grid">
<input id="airdate" value="2026-09-28" title="播出日"><input id="starttime" value="12:00" title="开播钟点，凌晨可填 00:00-05:59"><input id="pid" type="number" placeholder="节目 ID">
<input id="sid" type="number" placeholder="排期 ID"><input id="newpid" type="number" placeholder="替换节目 ID"><input id="expectedver" type="number" placeholder="计划版本（可空）" title="提交时带上页面显示的版本号；过期会被拒绝并返回对方最新时段">
<input id="movetime" placeholder="移动到钟点 HH:MM"><input id="moveday" placeholder="移动到播出日 YYYY-MM-DD"><input id="actualstart" value="12:00">
<input id="actualduration" type="number" value="30" placeholder="实播分钟"><input id="actualpid" type="number" placeholder="实播节目 ID，可空"></div>
<button onclick="schedule()">排期</button><button onclick="move()">移动档口</button><button onclick="replace()">替换</button><button onclick="playout()">记录实播</button><button onclick="reconcile()">对账</button>
<div id="result"></div></section>
<script>
const show=x=>document.querySelector('#result').innerHTML='';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function call(url,body){
  document.querySelector('#result').textContent='';
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  const box=document.querySelector('#result');
  if(!j.ok){
    box.innerHTML=`<p class="conflict">${r.status===409?'⚠️ 计划已被其他编辑更新：请先查看下方对方已改的时段，确认后用新版本号重新提交。\\n':''}${esc(j.error)}${j.day?'\\n\\n该播出日最新时段:\\n'+esc(JSON.stringify(j.day,null,2)):''}</p>`;
    if(j.day)renderPlan(lastState,j.day.broadcast_day);
    return j;
  }
  box.innerHTML=`<pre>${esc(JSON.stringify(j,null,2))}</pre>`;
  await load();
  return j;
}
function ver(body){const v=+document.querySelector('#expectedver').value;if(Number.isFinite(v)&&v>=0)body.expected_version=v;}
function addProgram(){call('/api/programs',{title:title.value,kind:kind.value,duration_minutes:+duration.value,start_date:start.value,end_date:end.value,regions:[region.value],sponsor:sponsor.value||null,cooldown_minutes:+cooldown.value})}
function schedule(){const b={air_date:airdate.value,start_time:starttime.value,program_id:+pid.value,region:region.value};ver(b);call('/api/schedule',b)}
function replace(){const b={new_program_id:+newpid.value};ver(b);call('/api/slots/'+sid.value+'/replace',b)}
function move(){const b={air_date:moveday.value||airdate.value,start_time:movetime.value||starttime.value};ver(b);call('/api/slots/'+sid.value+'/move',b)}
function playout(){call('/api/playout',{slot_id:+sid.value,actual_start:actualstart.value,actual_duration_minutes:+actualduration.value,actual_program_id:actualpid.value?+actualpid.value:null})}
function reconcile(){call('/api/reconcile',{date:airdate.value})}
let lastState=null;
function renderPlan(state,highlightDay){
  const days={};
  state.slots.forEach(s=>(days[s.broadcast_day]??=[]).push(s));
  const names=Object.fromEntries(state.programs.map(p=>[p.id,p.title]));
  document.querySelector('#plan').innerHTML=Object.keys(days).sort().map(d=>{
    const v=state.day_versions[d]??0;
    const rows=days[d].sort((a,b)=>a.start_at<b.start_at?-1:1).map(s=>
      `<tr${highlightDay===d?' style="background:#fff8e1"':''}><td>#${s.id}</td><td>${s.start_at.slice(11)} <span class=note>→ ${s.end_at}</span></td>
      <td>#${s.program_id} ${esc(names[s.program_id]||'')}</td><td>${s.region}</td><td>${s.status}${s.revision>1?' v'+s.revision:''}</td></tr>`).join('');
    return `<div class="day"><h3>播出日 ${d} <span class=note>（版本 ${v}）</span></h3><table>
      <tr><th>档口</th><th>开播–结束（绝对时间）</th><th>节目</th><th>地区</th><th>状态</th></tr>${rows}</table></div>`;
  }).join('')||'<p class=note>暂无排期</p>';
}
async function load(){
  lastState=await (await fetch('/api/state')).json();
  document.querySelector('#state').textContent=JSON.stringify(lastState,null,2);
  renderPlan(lastState);
}
load();
</script>
</html>
